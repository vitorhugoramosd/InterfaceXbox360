<!doctype html>
<html lang="pt-BR" data-blade="jogos">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' file:; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' file: data: blob: https: http:; media-src 'self' file: data:; connect-src 'self' file:">
  <title>Blade Dash</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/blades.css">
  <link rel="stylesheet" href="styles/screens.css">
  <link rel="stylesheet" href="styles/overlays.css">
  <link rel="stylesheet" href="styles/metro.css">
</head>
<body>
  <!-- Fundo: gradiente por blade + ambiência de luz animada (fora do palco, cobre a janela toda) -->
  <div id="bg" aria-hidden="true">
    <div class="bg-layer" data-theme="jogos"></div>
    <div class="bg-layer" data-theme="recentes"></div>
    <div class="bg-layer" data-theme="sistema"></div>
    <div class="bg-layer" data-theme="perfil"></div>
    <div id="ambience">
      <div class="orb o1"></div>
      <div class="orb o2"></div>
      <div class="orb o3"></div>
      <div class="orb o4"></div>
      <div class="orb o5"></div>
      <svg class="ribbons" viewBox="0 0 1920 1080" preserveAspectRatio="none">
        <defs>
          <linearGradient id="rg1" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#fff" stop-opacity="0"/>
            <stop offset=".45" stop-color="#fff" stop-opacity=".55"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <g class="rb rb1"><path d="M-200 820 C 300 640, 800 1000, 1300 760 S 2000 600, 2200 700" stroke="url(#rg1)" stroke-width="90" fill="none" opacity=".16"/></g>
        <g class="rb rb2"><path d="M-200 900 C 400 760, 900 1080, 1500 860 S 2100 820, 2200 880" stroke="url(#rg1)" stroke-width="34" fill="none" opacity=".22"/></g>
        <g class="rb rb3"><path d="M-200 300 C 300 180, 900 420, 1400 240 S 2000 160, 2200 220" stroke="url(#rg1)" stroke-width="160" fill="none" opacity=".07"/></g>
        <g class="rb rb4"><path d="M-200 980 C 500 900, 1000 1040, 2200 940" stroke="url(#rg1)" stroke-width="12" fill="none" opacity=".35"/></g>
      </svg>
      <div class="vignette"></div>
    </div>
  </div>

  <!-- Palco 1920x1080 escalado para a janela -->
  <div id="stage" class="scaled">
    <header id="topbar">
      <div id="dl-ind" class="dl-ind" hidden><span class="arr">⬇</span><span class="txt"></span><span class="bar"><i></i></span></div>
      <div id="running-ind" class="running-ind" hidden><span class="dot"></span><span class="txt"></span></div>
      <div class="tb-profile">
        <div id="tb-pic" class="avatar sm"></div>
        <div class="tb-text">
          <div id="tb-name" class="tb-name">Jogador</div>
          <div class="tb-clock" data-clock></div>
        </div>
      </div>
    </header>
    <main id="blades"></main>
    <main id="metro"></main>
  </div>

  <div id="veil"></div>
  <div id="modal-layer" class="scaled"></div>
  <!-- HUD acima do véu: dicas de botões sempre legíveis -->
  <div id="hud" class="scaled"><footer id="hints"></footer></div>
  <div id="splash" hidden><div class="scaled splash-inner"></div></div>
  <div id="toasts" class="scaled"></div>
  <div id="boot"><div class="scaled boot-inner"></div></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
